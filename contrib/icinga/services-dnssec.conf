apply Service "dnssec-" for ( dnssec_domain => config in host.vars.dnssec ) {
    import "generic-service"

    check_command = "dnssec-dnsviz"

    check_interval = 86400
    check_timeout = 180
    retry_interval = 3600
    max_check_attempts = 3

    vars += config

    assign where host.vars.dnssec
}
