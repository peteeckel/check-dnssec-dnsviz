object CheckCommand "dnssec-dnsviz" {
    command = [ PluginDir + "/check_dnssec_dnsviz" ]

    arguments = {
        "--zone" = {
            value = "$dnsviz_zone$"
            description = "Name of the DNS zone to check"
        }
        "--resolver" = {
            value = "$dnsviz_resolver$"
            description = "Resolver to use for DNS queries"
        }
        "--authoritative" = {
            set_if = "$dnsviz_authoritative$"
            description = "Use the authoritative resolvers for queries (slower, but more accurate)"
        }
        "--expire-warn" = {
            value = "$dnsviz_expire_warn$"
            description = "Warning threshold for the expiry time in hours (default: 72)"
        }
        "--expire-crit" = {
            value = "$dnsviz_expire_crit$"
            description = "Critical threshold for the expiry time in hours (default: 48)"
        }
        "--dnsviz" = {
            value = "$dnsviz_dnsviz$"
            description = "File name of the dnsviz command line tool"
        }
    }
}
